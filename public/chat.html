<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consola Sonambulos</title>
<style>
:root{--ink:#131120;--panel:#1D1A2C;--p2:#252137;--line:#2F2B44;--tx:#E9E5F2;--mu:#8983A6;--gold:#CBA135;--err:#D97070;--ok:#6FAE8C}
*{box-sizing:border-box}
body{margin:0 auto;max-width:520px;height:100vh;display:flex;flex-direction:column;background:var(--ink);color:var(--tx);font:15px/1.5 system-ui,sans-serif;border-left:1px solid var(--line);border-right:1px solid var(--line)}
header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{margin:0;font:400 24px Georgia,serif}
h1 i{color:var(--gold);font-style:normal}
.rt{display:flex;align-items:center;gap:10px}
.st{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);display:flex;align-items:center;gap:6px}
.d{width:7px;height:7px;border-radius:50%;background:var(--mu)}
.on{background:var(--ok)}
.off{background:var(--err)}
#lk{background:none;border:1px solid var(--line);border-radius:8px;color:var(--mu);font-size:14px;padding:4px 8px;cursor:pointer;line-height:1}
#lk.armed{border-color:var(--gold);color:var(--gold)}
.who{display:flex;gap:10px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.who label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
input{background:var(--ink);border:1px solid var(--line);border-radius:9px;color:var(--tx);font:13px ui-monospace,monospace;padding:9px 11px;flex:1;min-width:0}
#log{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.m{max-width:88%;padding:10px 13px;border-radius:9px;white-space:pre-wrap;word-break:break-word}
.me{align-self:flex-end;background:var(--gold);color:#191426;font:500 13px ui-monospace,monospace;border-bottom-right-radius:3px}
.bot{align-self:flex-start;background:var(--p2);border:1px solid var(--line);border-bottom-left-radius:3px}
.bad{border-color:rgba(217,112,112,.55);color:var(--err)}
footer{border-top:1px solid var(--line);background:var(--panel);padding:9px 16px 14px;display:flex;flex-direction:column;gap:8px}
.ch{display:flex;gap:6px;overflow-x:auto}
.ch button{flex:none;background:none;border:1px solid var(--line);border-radius:99px;color:var(--mu);font:11px ui-monospace,monospace;padding:5px 10px;white-space:nowrap}
.row{display:flex;gap:8px}
#msg{font-size:14px}
#go{background:var(--gold);color:#191426;border:0;border-radius:9px;font:600 14px system-ui;padding:0 17px}
</style>
</head>
<body>
<header>
  <h1>Son<i>a</i>mbulos</h1>
  <div class="rt">
    <div class="st"><span class="d" id="dot"></span><span id="stx">conectando</span></div>
    <button id="lk" title="Clave de tesorero">L</button>
  </div>
</header>
<div class="who"><label for="me">Eres</label><input id="me" value="+573001112233"></div>
<div id="log"></div>
<footer>
  <div class="ch" id="ch"></div>
  <div class="row">
    <input id="msg" placeholder="/send 5 tokens to @3153811758">
    <button id="go">Enviar</button>
  </div>
</footer>
<script>
var L=document.getElementById('log'),M=document.getElementById('msg'),G=document.getElementById('go'),ME=document.getElementById('me'),D=document.getElementById('dot'),S=document.getElementById('stx'),K=document.getElementById('lk');
function gk(){try{return localStorage.getItem('sb.k')||''}catch(e){return ''}}
function sk(v){try{v?localStorage.setItem('sb.k',v):localStorage.removeItem('sb.k')}catch(e){}paint()}
function paint(){var a=!!gk();K.textContent=a?'TESORERO':'CLAVE';K.className=a?'armed':''}
K.onclick=function(){if(gk()){if(confirm('Olvidar la clave de tesorero?'))sk('')}else{var p=prompt('Clave de tesorero:');if(p)sk(p)}};
try{var sp=localStorage.getItem('sb.p');if(sp)ME.value=sp}catch(e){}
ME.onchange=function(){try{localStorage.setItem('sb.p',ME.value)}catch(e){}};
['/balance','/send 5 tokens to @3153811758','/register Cherno','/history','/emit @3001112233 20','/help'].forEach(function(c){var b=document.createElement('button');b.textContent=c;b.onclick=function(){M.value=c;M.focus()};document.getElementById('ch').appendChild(b)});
function add(k,t){var d=document.createElement('div');d.className='m '+k;d.textContent=t;L.appendChild(d);L.scrollTop=L.scrollHeight}
function st(o){D.className='d '+(o?'on':'off');S.textContent=o?'en linea':'sin respuesta'}
async function go(t,retry){if(!t)return;if(!retry)add('me',t);M.value='';G.disabled=true;try{var r=await fetch('/webhook/sms',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({From:ME.value.trim(),Body:t,adminKey:gk()})});var j=await r.json();if(j.locked&&!retry){var p=prompt('Clave de tesorero:');if(p){sk(p);G.disabled=false;return go(t,true)}}add(j.response?'bot':'bot bad',j.response||'HTTP '+r.status);st(true)}catch(e){add('bot bad','No se pudo alcanzar el bot.');st(false)}G.disabled=false;M.focus()}
G.onclick=function(){go(M.value.trim())};
M.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();go(M.value.trim())}};
paint();
fetch('/').then(function(){st(true);go('/help')}).catch(function(){st(false)});
</script>
</body>
</html>
